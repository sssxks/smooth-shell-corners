name: Package & Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build extension zip
        run: |
          npm run build
          cd dist
          zip -9r ../smooth-shell-corners@xks.shell-extension.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: smooth-shell-corners@xks.shell-extension.zip
          body: |
            ## Instalación

            1. Descarga el archivo `.zip`
            2. Ve a https://extensions.gnome.org/local/ y usa **Instalar desde archivo**,
               o ejecuta:
               ```bash
               gnome-extensions install rounded-windows@marcosgt.github.io.shell-extension.zip
               ```

            ## Cambios

            Ver CHANGELOG.md en el repositorio para el resumen de esta versión.

            ---
            Para publicar en extensions.gnome.org, sube el `.zip` manualmente en:
            https://extensions.gnome.org/upload/
