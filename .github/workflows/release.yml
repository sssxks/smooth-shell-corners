name: Package & Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip
      - run: npm ci
      - run: npm run check
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const metadata = JSON.parse(fs.readFileSync('resources/metadata.json'));
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          if (process.env.GITHUB_REF_NAME !== `v${metadata['version-name']}` || pkg.version !== metadata['version-name'])
            throw new Error('Tag, package version and extension version must match');
          JS
      - name: Package extension
        run: |
          cd dist
          zip -9r ../smooth-shell-corners@xks.shell-extension.zip .
          cd ..
          sha256sum smooth-shell-corners@xks.shell-extension.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: |
            smooth-shell-corners@xks.shell-extension.zip
            SHA256SUMS
          body_path: docs/release-notes.md
